<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MPI Landing — compare Linear vs Editorial</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
    header {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid #333;
    }
    header h1 { margin: 0; font-size: 15px; font-weight: 600; }
    header p { margin: 0; font-size: 12px; color: #aaa; }
    .grid {
      display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 52px);
    }
    .col { display: flex; flex-direction: column; border-right: 1px solid #333; min-width: 0; }
    .col:last-child { border-right: 0; }
    .label {
      padding: 8px 12px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
      background: #1a1a1a; border-bottom: 1px solid #333; color: #9ad;
    }
    iframe { flex: 1; width: 100%; border: 0; background: #fff; }
    a { color: #9cf; }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; height: auto; }
      iframe { height: 70vh; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>MPI landing previews</h1>
      <p>Pick a direction — these are mockups only (not live auth).</p>
    </div>
    <p>
      <a href="/preview-landing/linear.html" target="_blank">Open Linear</a> ·
      <a href="/preview-landing/editorial.html" target="_blank">Open Editorial</a>
    </p>
  </header>
  <div class="grid">
    <div class="col">
      <div class="label">A · Linear-clean</div>
      <iframe title="Linear-clean preview" src="/preview-landing/linear.html"></iframe>
    </div>
    <div class="col">
      <div class="label">B · Richer editorial</div>
      <iframe title="Editorial preview" src="/preview-landing/editorial.html"></iframe>
    </div>
  </div>
</body>
</html>
